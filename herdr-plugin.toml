id = "worktree-devcontainer"
name = "Worktree Dev Container"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Run each Herdr worktree's devcontainer and open terminals inside it, keeping the worktree grouped under its repo"
platforms = ["linux", "macos"]

# Fires after Herdr has already created the worktree and opened its workspace.
# The plugin asks, in its own overlay, whether this worktree should get a container.
[[events]]
on = "worktree.created"
command = ["node", "bin/wtdc.mjs", "hook-created"]

# Fires after `herdr worktree remove` tore the checkout down.
[[events]]
on = "worktree.removed"
command = ["node", "bin/wtdc.mjs", "hook-removed"]

[[startup]]
command = ["node", "bin/wtdc.mjs", "startup"]

[[actions]]
id = "provision"
title = "Dev container: create for this worktree"
contexts = ["workspace"]
command = ["node", "bin/wtdc.mjs", "action", "provision"]

[[actions]]
id = "status"
title = "Dev container: status"
contexts = ["global", "workspace"]
command = ["node", "bin/wtdc.mjs", "action", "status"]

[[actions]]
id = "teardown"
title = "Dev container: destroy for this worktree"
contexts = ["workspace"]
command = ["node", "bin/wtdc.mjs", "action", "teardown"]

[[actions]]
id = "remove-worktree"
title = "Dev container: remove worktree, container and volumes"
contexts = ["workspace"]
command = ["node", "bin/wtdc.mjs", "action", "remove-worktree"]

[[actions]]
id = "cleanup"
title = "Dev container: retry interrupted cleanup"
contexts = ["global", "workspace"]
command = ["node", "bin/wtdc.mjs", "action", "cleanup"]

# Points terminal.default_shell at the dispatcher, keeping a .bak-before-wtdc copy of
# the config as it was, and reloads the server. Without this key every new pane runs the
# user's own shell, so a worktree with a running container still gives host terminals —
# and nothing reports it. Refuses to edit a config.toml it cannot read unambiguously.
[[actions]]
id = "install-shell"
title = "Dev container: install shell dispatcher"
contexts = ["global", "workspace"]
command = ["node", "bin/wtdc.mjs", "action", "install-shell"]

# Every pane command below is spelled out through $HERDR_PLUGIN_ROOT rather than left
# relative, and that is not a style choice. A pane runs with the working directory it was
# opened with — the worktree's checkout — so a relative `panes/prompt.mjs` resolves
# inside the *user's* repository, not inside this plugin. It worked here only because
# this plugin is developed in a worktree of itself, and it silently does nothing at all
# in every other repository. Herdr does not expand the variable itself, hence the shell.

# The yes/no checkbox shown right after a worktree is created.
[[panes]]
id = "prompt"
title = "Dev container?"
placement = "overlay"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/panes/prompt.mjs\""]

# Streams `devcontainer up` / teardown output in a normal tab.
[[panes]]
id = "build"
title = "Dev container"
placement = "tab"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/panes/build.mjs\""]

# The setup screen: zoomed over the worktree's pane, with a progress bar. It holds the
# keyboard until the container is ready, then becomes the container terminal.
[[panes]]
id = "boot"
title = "Setting up dev container"
placement = "zoomed"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/panes/boot.mjs\""]

# The one-shot container terminal the `provision` action opens.
[[panes]]
id = "container"
title = "Dev container shell"
placement = "tab"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/panes/container.mjs\""]
