name: images

# Builds every template in images/manifest.json and pushes to GHCR.
#
# Why this exists: a devcontainer.json that declares `features` makes the
# devcontainer CLI derive a per-workspace image, so every new worktree pays for
# an image build. These images declare no features, so `devcontainer up` is just
# `docker run` and a provision is a few seconds instead of half a minute.
#
# Shape: base builds first on its own, because every other template is FROM it
# and needs it published. Templates FROM base then build in parallel, and
# templates FROM one of those (vibecode-essential is FROM node-bun-docker)
# build in a second pass — joining the first pass would let a child's FROM
# resolve to whatever the parent's tag held before this run. The plan job reads
# the tiers out of manifest.json and errors on a nesting depth CI cannot order.
#
# Platforms: linux/amd64 and linux/arm64. Without an explicit `platforms`, buildx builds
# for the runner's own architecture and nothing else, and the single amd64 image is
# pushed under a tag that reads as universal. That is not a fallback on an arm64 host,
# it is a hard failure: the Dev Container CLI's uid-remap step runs `docker build
# --platform linux/amd64`, so provisioning a worktree on Apple Silicon or any ARM server
# dies rather than falling back.
#
# Only Linux, and only those two architectures. A devcontainer is a Linux container, so
# there is no macOS or Windows image to build; and arm/v7 is left out deliberately rather
# than by oversight — Herdr publishes linux-x86_64 and linux-aarch64 only, and the base
# image installs it, so an arm/v7 variant would have nothing to install.

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to the manifest tag)"
        required: false
        type: string
  schedule:
    # Daily, 00:00 UTC. The unpinned tools (Bun, cloudflared, the agent CLIs,
    # apt repository packages) resolve to "latest" only at build time and
    # ubuntu:24.04 moves underneath base, so without a timer the published tags
    # would freeze whatever was current at the last images/ commit. Scheduled
    # legs pull the parent fresh and skip the layer cache so the rebuild
    # actually re-resolves those versions instead of replaying cached layers.
    - cron: "0 0 * * *"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # One place, so the base and the derived templates can never drift apart. A devcontainer
  # is a Linux container, so there is no macOS or Windows image to build; arm/v7 is left
  # out deliberately rather than by oversight — Herdr publishes linux-x86_64 and
  # linux-aarch64 only, and the base image installs it, so arm/v7 would have nothing to
  # install.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # Validate and shape the build before anything expensive runs: a broken
  # manifest should fail in seconds, not after a full base build.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      derived: ${{ steps.plan.outputs.derived }}
      nested: ${{ steps.plan.outputs.nested }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag=$(jq -r .tag images/manifest.json)
          registry=$(jq -r .registry images/manifest.json)
          prefix=$(jq -r .prefix images/manifest.json)

          base=$(jq -c --arg reg "$registry" --arg pre "$prefix" --arg tag "$tag" '
            .images | map(select(.base == null))
            | if length != 1 then error("expected exactly one template with no base, found \(length)")
              else .[0] | {name, dir, ref: ($reg + "/" + $pre + "-" + .name + ":" + $tag)} end
          ' images/manifest.json)

          derived=$(jq -c --arg reg "$registry" --arg pre "$prefix" --arg tag "$tag" '
            .images
            | ([.[] | select(.base == null) | .name][0]) as $root
            | map(select(.base == $root))
            | {include: map({name, dir,
                ref: ($reg + "/" + $pre + "-" + .name + ":" + $tag),
                base_ref: ($reg + "/" + $pre + "-" + .base + ":" + $tag)})}
          ' images/manifest.json)

          # A template FROM a template is a third pass: it must wait for the
          # build job to publish its parent, so plan gives it its own matrix.
          # base_dir lets a PR build the parent locally — the parent is not
          # pushed on pull_request. Exactly one level of nesting is supported.
          nested=$(jq -c --arg reg "$registry" --arg pre "$prefix" --arg tag "$tag" '
            . as $doc
            | ([.images[] | select(.base == null) | .name][0]) as $root
            | ([.images[] | select(.base == $root) | .name]) as $tier1
            | .images | map(select(.base != null and .base != $root))
            | map(. as $img | if ($tier1 | index($img.base)) == null
                  then error("\($img.name): parent \"\($img.base)\" is not the root template or one level below it; CI supports one level of nesting")
                  else $img end)
            | {include: map(. as $img | {name, dir,
                ref: ($reg + "/" + $pre + "-" + $img.name + ":" + $tag),
                base_ref: ($reg + "/" + $pre + "-" + $img.base + ":" + $tag),
                base_dir: ($doc.images | map(select(.name == $img.base))[0].dir)})}
          ' images/manifest.json)

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "derived=$derived" >> "$GITHUB_OUTPUT"
          echo "nested=$nested" >> "$GITHUB_OUTPUT"

          echo "base:   $(jq -r .ref <<<"$base")"
          jq -r '.include[] | "derive: \(.ref)  (from \(.base_ref))"' <<<"$derived"
          jq -r '.include[] | "nested: \(.ref)  (from \(.base_ref))"' <<<"$nested"

  build-base:
    name: build base
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # QEMU is what makes the arm64 half of PLATFORMS buildable on an amd64 runner. It is
      # emulation, so this leg is slow — the base image installs apt packages and Herdr
      # under emulation.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: ${{ fromJson(needs.plan.outputs.base).dir }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ fromJson(needs.plan.outputs.base).ref }}
          provenance: false
          # Scheduled runs exist to refresh "latest" versions, so replaying
          # cached layers would be a no-op: pull the upstream base fresh and
          # skip the cache entirely.
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

  build:
    name: build ${{ matrix.name }}
    needs: [plan, build-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.derived) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ matrix.ref }}
          provenance: false
          # Same reason as build-base: a scheduled run that hit the cache would
          # ship the versions that were latest the last time this layer ran.
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Templates FROM a derived template — vibecode-essential is FROM
  # node-bun-docker. They wait for the build matrix so FROM resolves to the
  # tag published this run, not whatever the tag held before it.
  build-nested:
    name: build ${{ matrix.name }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.nested) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # On a pull request nothing was pushed, so matrix.base_ref names the
      # parent's previous publish — building against it would not test this
      # PR's parent changes at all. Build the parent into the local daemon
      # first, and point the child's FROM at that local tag. The container
      # driver cannot see local images, so the child build uses the docker
      # driver (native platform, build-only — arch coverage is verify-dind's
      # job, which rebuilds both legs anyway). The parent still takes its own
      # ARG default for BASE_IMAGE, the published base — the same base every
      # other PR leg builds against.
      - name: Build parent locally (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --builder default \
            --tag wtdc-parent:${{ matrix.name }} \
            ${{ matrix.base_dir }}
      - name: Build and push
        uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: ${{ matrix.dir }}
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_ref }}
          push: true
          tags: ${{ matrix.ref }}
          provenance: false
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Build against local parent (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --builder default \
            --build-arg BASE_IMAGE=wtdc-parent:${{ matrix.name }} \
            ${{ matrix.dir }}

  # Exercise DinD on native runners, including PRs, without publishing test images.
  verify-dind:
    name: Docker-in-Docker ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install verification tools
        run: |
          npm install --global @devcontainers/cli
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck images/node-bun-docker/docker-init.sh images/vibecode-essential/docker-init.sh tests/dind-smoke.sh images/vibecode-essential/*.sh
      # Both DinD images build the whole chain locally: vibecode-essential is
      # FROM base too now — inheriting node-bun-docker would bake in ~320MB of
      # NodeSource nodejs and bun@latest layers this image immediately replaces.
      # Plain docker build so each FROM resolves to the tag built on this runner.
      - name: Build images on the runner
        run: |
          docker build --tag wtdc-base:verify images/base
          docker build --build-arg BASE_IMAGE=wtdc-base:verify --tag wtdc-node-bun-docker:verify images/node-bun-docker
          docker build --build-arg BASE_IMAGE=wtdc-base:verify --tag wtdc-vibecode-essential:verify images/vibecode-essential
      # The image's own check of every pinned and unpinned tool. The inherited
      # entrypoint would start dockerd, so run the script as the entrypoint;
      # it needs client tools only.
      - name: Verify vibecode-essential toolset
        run: docker run --rm --entrypoint /usr/local/share/vibecode-essential-smoke.sh wtdc-vibecode-essential:verify
      - name: Verify bundled Docker-in-Docker
        timeout-minutes: 15
        run: |
          bash tests/dind-smoke.sh wtdc-node-bun-docker:verify
          bash tests/dind-smoke.sh wtdc-vibecode-essential:verify

  # Runs each template on each architecture, natively. Verifying on the amd64 runner alone
  # would only ever test the amd64 half: `docker run <tag>` picks the image matching the
  # daemon, so an arm64-only regression — a layer that fails to unpack, a binary built for
  # the wrong arch — passes CI and then fails on the user's machine, which is the one place
  # it is expensive.
  verify:
    name: verify ${{ matrix.platform }}
    needs: [plan, build-base, build, build-nested]
    # The skipped arm is for the day the manifest has no nested templates: an
    # empty matrix marks build-nested skipped, and without naming that result
    # acceptable, needs would skip this job and publish unverified. This runs on
    # PRs too: it verifies the published :latest images, not the PR build, and a
    # skipped matrix job here reports the whole check-suite as failed.
    if: >-
      needs.build-nested.result == 'success' || needs.build-nested.result == 'skipped'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every template is pullable and runs herdr
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [ -n "$tag" ] || tag=$(jq -r .tag images/manifest.json)
          registry=$(jq -r .registry images/manifest.json)
          prefix=$(jq -r .prefix images/manifest.json)
          platform='${{ matrix.platform }}'

          # What `uname -m` reports for each platform, which is the only answer that
          # matters: whether the image that gets pulled actually runs here.
          case "$platform" in
            linux/amd64) want_uname=x86_64 ;;
            linux/arm64) want_uname=aarch64 ;;
            *) echo "::error::no expected uname for $platform"; exit 1 ;;
          esac

          fail=0
          while read -r name; do
            ref="$registry/$prefix-$name:$tag"
            printf '::group::%s (%s)\n' "$ref" "$platform"

            # Ask the running container, not `docker image inspect`. Inspecting a tag that
            # is a manifest list reports the index, which carries no single architecture,
            # so it answers with an empty string on a runner that has not pulled the image
            # yet — a check that fails for every image while proving nothing about any.
            got_uname="$(docker run --rm --platform "$platform" --entrypoint uname "$ref" -m)"
            if [ "$got_uname" != "$want_uname" ]; then
              echo "::error::$ref reports uname -m '$got_uname' on $platform, expected '$want_uname'"
              fail=1
            fi
            if ! docker run --rm --platform "$platform" --entrypoint /usr/local/bin/herdr "$ref" --version; then
              echo "::error::$ref is not runnable on $platform"
              fail=1
            fi
            if [ "$name" = node-bun ] || [ "$name" = node-bun-docker ]; then
              for tool in node bun; do
                if ! docker run --rm --platform "$platform" --entrypoint "$tool" "$ref" --version; then
                  echo "::error::$ref cannot run $tool on $platform"
                  fail=1
                fi
              done
            fi
            if [ "$name" = node-bun-docker ]; then
              for tool in git make docker dockerd cloudflared; do
                if ! docker run --rm --platform "$platform" --entrypoint "$tool" "$ref" --version; then
                  echo "::error::$ref cannot run $tool on $platform"
                  fail=1
                fi
              done
              if ! docker run --rm --platform "$platform" --entrypoint direnv "$ref" version; then
                echo "::error::$ref cannot run direnv on $platform"
                fail=1
              fi
              if ! docker run --rm --platform "$platform" --entrypoint docker "$ref" compose version; then
                echo "::error::$ref cannot run docker compose on $platform"
                fail=1
              fi
            fi
            if [ "$name" = vibecode-essential ]; then
              # The image's own check of every pinned and unpinned tool, run as
              # dev on this architecture. --entrypoint replaces the inherited
              # DinD init, which this check does not need.
              if ! docker run --rm --platform "$platform" --entrypoint /usr/local/share/vibecode-essential-smoke.sh "$ref"; then
                echo "::error::$ref failed its bundled toolset smoke check on $platform"
                fail=1
              fi
            fi
            printf '::endgroup::\n'
          done < <(jq -r '.images[].name' images/manifest.json)
          exit "$fail"
